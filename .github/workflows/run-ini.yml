name: Run ini.py

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET to confirm the reset operation'
        required: true
        type: string

permissions:
  contents: write

jobs:
  run-ini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run script/ini.py
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "RESET" ]; then
            echo "Invalid confirmation. Expected RESET."
            exit 1
          fi
          printf 'RESET\n' | python script/ini.py

      - name: Commit reset changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git add data curriculum history tests
          git commit -m 'chore: run learning memory reset'
          git push
